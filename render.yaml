services:
  - type: web
    name: story-spinner-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py import_story_elements --clear
    startCommand: gunicorn core.wsgi --workers 2 --bind 0.0.0.0:$PORT
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: story-spinner-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://story-spinner-plus.vercel.app
      - key: ANTHROPIC_API_KEY
        sync: false
