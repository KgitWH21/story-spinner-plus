services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: story_spinner_db
      POSTGRES_USER: spinner_user
      POSTGRES_PASSWORD: spinner_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spinner_user -d story_spinner_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
